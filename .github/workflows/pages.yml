# Deploy site/ — and ONLY site/ — to GitHub Pages (ADR-0001, QST-DEPLOY-METHOD = A),
# after the same checks as the local gate pass (ADR-0005, QST-DEPLOY-GATE = A).
#
# One-time repo setting required: Settings → Pages → Source = "GitHub Actions".

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false # never cut a Pages deployment off halfway

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Secret scan (no OpenRouter keys in the repo)
        run: bash scripts/secret-scan.sh
      - name: Unit tests
        run: node --test "tests/**/*.test.js"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
